<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#53273d"><title>Rang Studio · Textile colour studio</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f6f1;color:#342d30;font:16px/1.45 system-ui,sans-serif}button,select,input{font:inherit;color:inherit}button,select,input[type=color]{cursor:pointer}button{background:#fff;border:1px solid #dcd5ce;border-radius:7px;padding:8px 14px;font-size:14px;font-weight:550}button:hover{border-color:#97566e}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ad627a;outline-offset:2px}header{height:70px;display:flex;align-items:center;padding:0 max(4vw,calc((100vw - 1240px)/2));background:#422638;color:#fff;gap:42px}.brand{display:flex;align-items:center;gap:12px;white-space:nowrap;font:bold 26px Georgia,serif}.brand svg{display:block;width:40px;height:40px}nav{display:flex;gap:8px}nav button{background:none;color:#e9dfe4;border:0}nav .active{background:#684457;color:white}b{font-size:12px;border-radius:15px;background:#ffffff21;padding:2px 6px}.sig{margin-left:auto;white-space:nowrap;font-size:12px;letter-spacing:.18em;color:#e7d8ca}main{max-width:1320px;margin:auto;padding:32px 4vw 60px}.kicker{color:#8c5266;font-weight:750;font-size:12px;letter-spacing:.15em}.intro h1{font:normal clamp(36px,4vw,54px)/1.12 Georgia,serif;margin:5px 0}.intro p{margin:6px 0 25px;color:#696365}.workspace{display:grid;grid-template-columns:minmax(260px,0.85fr) minmax(0,2.3fr);gap:22px}aside,article,.tile{background:white;border:1px solid #ded9d2;border-radius:13px;overflow:hidden}aside{padding:21px;display:flex;flex-direction:column;align-items:stretch}h2{font:normal 26px/1.2 Georgia,serif;margin:0}aside h2{font-size:23px}.group{padding:16px 0;border-bottom:1px solid #eee8e3}.last{border:0}label{display:block;font-size:14px;font-weight:650;margin-bottom:8px}.hex{display:flex;align-items:center;padding:4px 8px;gap:8px;border:1px solid #ded9d2;border-radius:6px}.hex input[type=text],#hex{width:80%;border:0;font-family:monospace}.hex input[type=color],.pal input{width:30px;height:28px;border:0;padding:0;background:transparent}.quick,.chips,.segment,.actions{display:flex;gap:6px;flex-wrap:wrap}.quick{margin-top:10px;gap:8px}.quick button{width:23px;height:23px;padding:0;border:1px solid #0002;border-radius:50%}select{width:100%;border:1px solid #ded9d2;background:#fff;border-radius:6px;padding:7px;margin-bottom:15px}.segment{padding:3px;background:#f2efeb;border-radius:8px;flex-wrap:nowrap;gap:1px}.segment button{flex:1;background:none;border:0;padding:5px 10px;white-space:nowrap;color:#675e61}.segment .on{background:white;box-shadow:0 1px 4px #0002;color:#632e47}.chips button{border-radius:20px;font-size:13px;padding:4px 11px}.chips .on{background:#f6e8ed;border-color:#ac7589;color:#6d344b}.primary{background:#68354e;color:white;padding:10px;margin-top:auto;border:0}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:18px 22px}.cardhead h2{margin-top:3px}article{display:flex;flex-direction:column}#art{position:relative;flex:1;min-height:245px;background:#ede8e2}#art svg{position:absolute;width:100%;height:100%}.pal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:15px 19px}.colour{display:flex;align-items:center;gap:7px}.colour input{width:32px;height:36px}.colour small{font-size:12px;color:#716667;display:block}.colour button{border:0;padding:0;font:13px monospace}.actions{padding:12px 20px;border-top:1px solid #eee9e4}.actions button{font-size:13px}.actions button:last-child{margin-left:auto}.collection{margin-top:30px}.collection h2{margin:5px 0 15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.tile{text-align:left;padding:0;display:block;min-width:0}.tile svg{display:block;width:100%;height:105px}.caption{display:flex;padding:12px;align-items:center;justify-content:space-between;gap:4px}.dots{display:flex}.dots i{width:13px;height:13px;border:1px solid white;border-radius:50%;margin-left:-3px}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#422638;color:white;border-radius:8px;padding:9px 18px;display:none;z-index:3;text-align:center}.savedMode .workspace,.savedMode .intro{display:none}@media(max-width:850px){.sig{display:none}.workspace{grid-template-columns:250px minmax(0,1fr)}.pal{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(2,1fr)}.cardhead{flex-wrap:wrap}}@media(max-width:650px){header{height:58px;padding:0 14px;justify-content:space-between;gap:6px}.brand{font-size:22px;gap:6px}.brand svg{width:30px}nav button{padding:6px 9px}main{padding:20px 14px 38px}.workspace{display:flex;flex-direction:column}.workspace article{order:-1}#art{min-height:250px}.cardhead{padding:14px}.cardhead h2{font-size:22px}.pal,.actions{padding:10px 12px}.actions{gap:4px}.actions button{padding:7px 8px}.intro p{font-size:15px;margin-bottom:18px}.grid{gap:9px}.caption{flex-wrap:wrap}.tile svg{height:85px}.segment button{padding:5px 8px}}

@media(max-width:650px){
  .workspace{gap:14px}
  .workspace article{order:0}
  .mobile-jump{display:block;background:#68354e;color:white;border-radius:7px;padding:10px 14px;text-decoration:none;text-align:center}
  .workspace aside{order:1}
  .quick button{width:30px;height:30px}
  #art{min-height:260px}
  .actions button,.segment button,.chips button{min-height:40px}
  .actions{flex-wrap:wrap}
}
@media(min-width:651px){.mobile-jump{display:none}}
@media(min-width:1000px){#art{min-height:340px}}
html{scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body><header><div class="brand"><span id="logo"></span>Rang Studio</div><nav><button id="studioNav" class="active">Studio</button><button id="savedNav">Saved <b id="count">0</b></button></nav><span class="sig">JINI DESIGN STUDIO</span></header><main><section class="intro"><div class="kicker">TEXTILE WORKSPACE</div><h1>Textile colour studio</h1><p>Explore colour pairings and see your print come to life.</p></section><div class="workspace"><a class="mobile-jump" href="#settings">Edit print settings</a><aside id="settings"><h2>Print settings</h2><div class="group"><label for="hex">Ground colour</label><div class="hex"><input aria-label="Choose ground colour" id="picker" type="color"><input id="hex" maxlength="7" spellcheck="false"></div><div class="quick" id="quick"></div></div><div class="group"><label for="motif">Motif style</label><select id="motif"><option>Floral buta</option><option>Paisley</option><option>Mughal jaal</option><option>Geometric</option></select><label>Motif size</label><div id="sizes" class="segment"></div></div><div class="group last"><label>Colour mood</label><div id="moods" class="chips"></div></div><button id="mix" class="primary">⤨ &nbsp; Generate pairing</button><a class="mobile-jump" style="margin-top:8px" href="#preview">View print preview</a></aside><article id="preview"><div class="cardhead"><div><div class="kicker">LIVE PREVIEW</div><h2 id="name"></h2></div><div class="segment" id="views"></div></div><div id="art"></div><div class="pal" id="pal"></div><div class="actions"><button id="save">♡ &nbsp; Save palette</button><button id="copy">Copy HEX</button><button id="download">Download PNG</button></div></article></div><section class="collection"><div class="kicker">COLOUR LIBRARY</div><h2 id="collectionTitle">Ready-made palettes</h2><div class="grid" id="grid"></div></section></main><div role="status" id="toast"></div><script>const $=id=>document.getElementById(id);
const sets=[
 ['Rosewood garden','#EBC6BC','#803950','#556451','#FBE5C5','Floral buta'],
 ['Indigo mist','#CADAE6','#365178','#698D97','#FFF3DD','Paisley'],
 ['Marigold dusk','#E4AF51','#9C493C','#546345','#FFF0B9','Mughal jaal'],
 ['Sage meadow','#D9DFCD','#45694F','#B68170','#FFF1D5','Floral buta'],
 ['Bridal wine','#76243E','#F1C673','#BF7984','#FFF0D2','Geometric'],
 ['Coral bloom','#F1B3A0','#9B384B','#547B71','#FFF0CA','Floral buta'],
 ['Midnight jaal','#29384E','#E3B668','#8C9CA2','#F0E2C8','Mughal jaal'],
 ['Teal orchard','#376D69','#FFE0A2','#B99579','#E4EDCE','Paisley']
];
const roles=['Ground','Motif','Foliage','Accent'];
const preset=s=>({name:s[0],c:s.slice(1,5),motif:s[5],size:'Medium'});
let design=preset(sets[0]), view='Swatch', mood='Classic',saved=[],savedMode=false,seq=0,timer;
try{saved=JSON.parse(localStorage.getItem('jini-rang-studio-palettes')||'[]').filter(d=>d&&d.c?.length===4&&d.c.every(x=>/^#[0-9a-f]{6}$/i.test(x)))}catch{}
function notify(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('toast').style.display='none',1900)}
function petals(n,rx,ry,dist,fill){return Array.from({length:n},(_,i)=>'<ellipse cx="0" cy="-'+dist+'" rx="'+rx+'" ry="'+ry+'" fill="'+fill+'" transform="rotate('+i*360/n+')"/>').join('')}
$('logo').innerHTML='<svg viewBox="-21 -21 42 42">'+petals(8,4.3,8,10,'#ebc9a3')+'<circle r="5" fill="#784259"/><circle r="2" fill="#ebc9a3"/></svg>';
function artwork(d,type='Swatch',thumb=false,tile=false){
 const [bg,ink,leaf,cream]=d.c,id='p'+(++seq),u={Small:75,Medium:103,Large:140}[d.size]||103;
 const flower='<g>'+petals(9,2.9,4.8,5.8,ink)+petals(9,.65,2.7,6.2,cream)+'<circle r="3.6" fill="'+cream+'"/><circle r="1.8" fill="'+ink+'"/></g>';
 const blade='<path d="M0 0 Q-9 -1 -11 -12 Q-1 -11 0 0Z" fill="'+leaf+'"/><path d="M-1 -1L-8 -9" stroke="'+bg+'" stroke-width=".8"/>';
 const floral='<g fill="none" stroke="'+leaf+'" stroke-width="1.35"><path d="M-7 25Q4 16 0 -12M-3 20Q-14 13 -16 0M-1 15Q10 10 12 -2"/></g><g transform="translate(0 11)">'+blade+'</g><g transform="translate(-2 18) scale(-.9 .9)">'+blade+'</g><g transform="translate(-11 12)">'+blade+'</g><g transform="translate(8 7) scale(-.7 .7)">'+blade+'</g><g transform="translate(0 -14)">'+flower+'</g><g transform="translate(-16 -1) rotate(-25) scale(.63)">'+flower+'</g><g transform="translate(13 -4) rotate(25) scale(.74)">'+flower+'</g>';
 const paisley='<path d="M-1 25C-27 14 -16 -9 -2 -20Q8 -27 7 -31C24 -14 1 -14 13 1C24 18 11 29 -1 25Z" fill="'+ink+'"/><path d="M-1 20C-18 18 -15 1 1 -12Q-2 -4 7 5C17 18 8 23 -1 20Z" fill="'+leaf+'" stroke="'+cream+'" stroke-width="1.2"/><g transform="translate(0 11) scale(.65)">'+flower+'</g>';
 const geo='<path d="M0 -24L17 0 0 24 -17 0Z" fill="'+ink+'"/><path d="M0 -18L12 0 0 18 -12 0Z" stroke="'+cream+'" fill="none"/>'+flower;
 const sprig=d.motif==='Paisley'?paisley:d.motif==='Geometric'?geo:floral;
 const lattice=d.motif==='Mughal jaal'||d.motif==='Geometric'?'<path d="M-50 50Q0 35 0 0Q0 35 50 50Q100 65 100 100M0 100Q0 65 50 50Q100 35 100 0" fill="none" stroke="'+leaf+'" stroke-width="1.5"/>':'';
 const repeat='<rect width="100" height="100" fill="'+bg+'"/>'+lattice+[[-1,-1],[0,0],[100,0],[0,100],[100,100],[50,50]].slice(1).map(([x,y])=>'<g transform="translate('+x+' '+y+') rotate('+(x===50?-12:12)+') scale(.87)">'+sprig+'</g>').join('')+'<g transform="translate(50 0) scale(.28)">'+flower+'</g><g transform="translate(50 100) scale(.28)">'+flower+'</g>';
 const kurti=type==='Kurti',w=tile?u:thumb?320:800,h=tile?u:thumb?112:310,unit=kurti?u*.44:u;
 const shape='M372 17Q382 31 400 32Q418 31 428 17L462 29L494 99L470 111L446 67L455 282Q400 295 345 282L354 67L330 111L306 99L338 29Z';
 return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="'+(kurti?'xMidYMid meet':'xMidYMid slice')+'"><defs><pattern id="'+id+'" width="'+unit+'" height="'+unit+'" patternUnits="userSpaceOnUse" viewBox="0 0 100 100">'+repeat+'</pattern></defs>'+(kurti?'<path d="'+shape+'" fill="url(#'+id+')" stroke="'+ink+'" stroke-width="2"/><path d="M373 18Q399 57 427 18M400 37V88M346 274Q400 287 454 274M310 93L333 104M467 104L490 93" fill="none" stroke="'+cream+'" stroke-width="5"/>':'<rect width="100%" height="100%" fill="url(#'+id+')"/>')+'</svg>'
}
function choose(id,options,current,callback,cls='on'){const root=$(id);root.replaceChildren();options.forEach(s=>{const b=document.createElement('button');b.textContent=s;b.classList.toggle(cls,s===current);b.setAttribute('aria-pressed',String(s===current));b.onclick=()=>callback(s);root.append(b)})}
const key=d=>[...d.c,d.motif,d.size].join('|');
function library(){const g=$('grid');g.replaceChildren();$('collectionTitle').textContent=savedMode?'Saved palettes':'Ready-made palettes';(savedMode?saved:sets.map(preset)).forEach(d=>{const b=document.createElement('button');b.className='tile';b.innerHTML=artwork(d,'Swatch',true)+'<span class="caption"><span></span><span class="dots">'+d.c.map(c=>'<i style="background:'+c+'"></i>').join('')+'</span></span>';b.querySelector('.caption span').textContent=d.name;b.onclick=()=>{design={...d,c:[...d.c]};mode(false);window.scrollTo({top:0,behavior:'smooth'})};g.append(b)});if(savedMode&&!saved.length)g.textContent='Save a palette from the studio to find it here.'}
function mode(value){savedMode=value;document.body.classList.toggle('savedMode',value);$('studioNav').classList.toggle('active',!value);$('savedNav').classList.toggle('active',value);render();library()}
function edit(i,x){design.c[i]=x.toUpperCase();design.name='Custom colourway';render()}
async function copy(s){try{await navigator.clipboard.writeText(s);notify('Copied to clipboard')}catch{prompt('Copy these colours',s)}}
function render(){ $('count').textContent=saved.length;$('name').textContent=design.name;$('art').innerHTML=artwork(design,view);$('hex').value=design.c[0];$('picker').value=design.c[0];$('motif').value=design.motif;
 choose('sizes',['Small','Medium','Large'],design.size,s=>{design.size=s;render()});choose('views',['Swatch','Kurti'],view,s=>{view=s;render()});choose('moods',['Classic','Light','Bright','Dusty','Dark','Festive'],mood,s=>{mood=s;generate()});
 $('pal').replaceChildren();design.c.forEach((c,i)=>{const e=document.createElement('div');e.className='colour';e.innerHTML='<input type="color" aria-label="Edit '+roles[i]+'" value="'+c+'"><div><small>'+roles[i]+'</small><button title="Copy '+c+'">'+c+'</button></div>';e.querySelector('input').onchange=ev=>edit(i,ev.target.value);e.querySelector('button').onclick=()=>copy(c);$('pal').append(e)});const exists=saved.some(d=>key(d)===key(design));$('save').textContent=exists?'♥  Saved':'♡  Save palette';$('save').title=exists?'Remove from saved palettes':'Save this palette'}
function hsl(h,s,l){const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,'0')};return ('#'+[0,8,4].map(f).join('')).toUpperCase()}
function generate(){const bg=design.c[0],rgb=bg.slice(1).match(/../g).map(x=>parseInt(x,16)/255),[r,g,b]=rgb,max=Math.max(...rgb),delta=max-Math.min(...rgb);let hue=delta===0?0:max===r?(g-b)/delta:max===g?2+(b-r)/delta:4+(r-g)/delta;hue=(hue*60+375+Math.random()*60)%360;const dark=.299*r+.587*g+.114*b<.48;
 const [sat,light]=({Classic:[.45,.33],Light:[.39,.52],Bright:[.77,.43],Dusty:[.22,.42],Dark:[.48,.23],Festive:[.76,.38]})[mood];design.c=[bg,hsl(hue,sat,dark?.76:light),hsl((hue+115)%360,sat*.65,dark?.65:light+.03),hsl(mood==='Festive'?44:(hue+45)%360,.7,dark?.83:.91)];design.name=mood+' colourway';render()}
$('motif').onchange=e=>{design.motif=e.target.value;render()};$('picker').onchange=e=>edit(0,e.target.value);$('hex').onchange=e=>{const v=e.target.value.trim().replace(/^#/,'');if(/^[a-f0-9]{6}$/i.test(v))edit(0,'#'+v);else{notify('Enter a six-digit HEX colour');render()}};$('hex').onkeydown=e=>{if(e.key==='Enter')e.target.blur()};
sets.map(x=>x[1]).forEach(c=>{const b=document.createElement('button');b.style.background=c;b.setAttribute('aria-label','Set ground to '+c);b.onclick=()=>edit(0,c);$('quick').append(b)});
$('mix').onclick=generate;$('copy').onclick=()=>copy(design.c.join('  '));$('studioNav').onclick=()=>mode(false);$('savedNav').onclick=()=>mode(true);
$('save').onclick=()=>{const i=saved.findIndex(d=>key(d)===key(design));if(i>=0)saved.splice(i,1);else saved.unshift({...design,c:[...design.c]});try{localStorage.setItem('jini-rang-studio-palettes',JSON.stringify(saved));notify(i>=0?'Palette removed':'Palette saved on this device')}catch{notify('Saved for this session only')}render()};
$('download').onclick=()=>{const img=new Image(),kurti=view==='Kurti',canvas=document.createElement('canvas');canvas.width=kurti?1600:1536;canvas.height=kurti?620:1536;let svg=artwork(design,view,false,!kurti).replace('<svg ','<svg width="'+canvas.width+'" height="'+canvas.height+'" ');const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));img.onload=()=>{canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);canvas.toBlob(blob=>{if(!blob)return notify('Download could not be prepared');const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rang-'+(kurti?'kurti':'repeat-tile')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000);notify('PNG ready')})};img.onerror=()=>{URL.revokeObjectURL(url);notify('Download could not be prepared')};img.src=url};
render();library();
</script></body></html>
