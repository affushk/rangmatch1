}
function stronger(c){
  const target=ratio(c[0],'#000000')>=ratio(c[0],'#FFFFFF')?0:255;
  const rgb=c[1].slice(1).match(/../g).map(x=>parseInt(x,16));
  for(let step=1;step<=100;step++){
    const shade='#'+rgb.map(x=>Math.round(x+(target-x)*step/100).toString(16).padStart(2,'0')).join('').toUpperCase();
    if(ratio(c[0],shade)>=4.5)return [c[0],shade,c[2],c[3]];
  }
  return c.slice();
}
function contrastView(p){
  const c=stronger(p.c);
  const labels=['Before · '+ratio(...p.c).toFixed(2)+':1','After · '+ratio(...c).toFixed(2)+':1'];
  const apply=button('Apply motif colour',()=>{
    if(tab==='Saved'){p.c=c;persist()}else edits.set(p.id,c);
    closeView();render();
  });
  openView('Motif contrast',pairView(p,{...p,c},labels,apply));
}
function addCardTools(e,p){
  const art=e.querySelector('.art');
  art.tabIndex=0;art.setAttribute('role','button');art.setAttribute('aria-label','Zoom '+p.name);
  art.onclick=()=>zoomView(p);
  art.onkeydown=event=>{if(['Enter',' '].includes(event.key)){event.preventDefault();zoomView(p)}};
  const tools=document.createElement('div'); tools.className='viewerTools';
  const selected=selections.some(x=>signature(x)===signature(p));
  const choose=button(selected?'✓ Selected':'Compare',()=>togglePalette(p));
  choose.setAttribute('aria-pressed',selected);
  tools.append(choose,button('Full view',()=>zoomView(p)));
  if(style!=='My PNG'&&ratio(...p.c)<4.5)tools.append(button('Improve contrast',()=>contrastView(p)));
  e.querySelector('.content').append(tools);
  if(style==='My PNG')e.querySelector('.meta').textContent='Original PNG colours';
}
$('viewerClose').onclick=closeView;
$('space').oninput=e=>{spacing=Number(e.target.value)/100;$('spaceLabel').textContent=e.target.value+'%';render()};
$('upload').onchange=async e=>{
  const file=e.target.files[0];if(!file)return;
  const ticket=++uploadTicket;
  try{
    const header=new Uint8Array(await file.slice(0,24).arrayBuffer());
    if(![137,80,78,71,13,10,26,10].every((x,j)=>header[j]===x))throw Error('Choose a PNG image');
    const reader=new FileReader();
    const data=await new Promise((resolve,reject)=>{reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});
    const image=new Image();image.src=data;await image.decode();
    if(ticket!==uploadTicket)return;
    png=data;style='My PNG';
    if(!Array.from($('style').options).some(o=>o.value===style))$('style').add(new Option(style,style));
    $('style').value=style;$('uploadName').textContent=file.name;render();
  }catch(err){if(ticket===uploadTicket)note(err.message==='Choose a PNG image'?err.message:'This PNG could not be opened')}
  finally{if(ticket===uploadTicket)e.target.value=''}
};

$('style').replaceChildren(...styles.map(s=>new Option(s,s)));$('style').onchange=e=>{style=e.target.value;render()};$('hex').onchange=e=>setGround('#'+e.target.value.trim().replace(/^#/,''));$('hex').onkeydown=e=>{if(e.key==='Enter')e.target.blur()};$('picker').onchange=e=>setGround(e.target.value);quick.forEach(c=>{const b=button('',()=>setGround(c));b.title=c;b.setAttribute('aria-label','Use '+c);b.style.background=c;$('quick').append(b)});render()
</script></html>
