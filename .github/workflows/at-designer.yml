name: AT Designer APK
on:
  push:
    branches: [rang-studio]
    paths: ['.github/workflows/at-designer.yml','docs/print-matchings.html']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use preinstalled Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -x "$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          if [ ! -f "$SDK/platforms/android-35/android.jar" ] || [ ! -x "$SDK/build-tools/35.0.0/aapt2" ]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Prepare Android project
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/atdesigner/app
          cp -r docs/. app/src/main/assets/
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }; dependencyResolutionManagement { repositories { google(); mavenCentral() } }; rootProject.name='ATDesigner'; include ':app'" > settings.gradle
          echo "plugins { id 'com.android.application' version '8.7.3' }; android { namespace 'com.atdesigner.app'; compileSdk 35; defaultConfig { applicationId 'com.atdesigner.app'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0' } }" > app/build.gradle
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="AT Designer" android:theme="@android:style/Theme.Material.Light.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > app/src/main/java/com/atdesigner/app/MainActivity.java <<'EOF'
          package com.atdesigner.app;
          import android.app.*; import android.os.*; import android.content.*; import android.net.Uri; import android.webkit.*;
          public class MainActivity extends Activity {
            WebView web; ValueCallback<Uri[]> picker;
            public void onCreate(Bundle b){super.onCreate(b);web=new WebView(this);setContentView(web);web.getSettings().setJavaScriptEnabled(true);web.getSettings().setDomStorageEnabled(true);web.getSettings().setAllowFileAccess(true);web.setWebViewClient(new WebViewClient());web.setWebChromeClient(new WebChromeClient(){public boolean onShowFileChooser(WebView w,ValueCallback<Uri[]> cb,FileChooserParams p){if(picker!=null)picker.onReceiveValue(null);picker=cb;try{startActivityForResult(p.createIntent(),42);}catch(Exception e){picker.onReceiveValue(null);picker=null;}return true;}});web.loadUrl("file:///android_asset/print-matchings.html");}
            protected void onActivityResult(int r,int c,Intent d){super.onActivityResult(r,c,d);if(r==42&&picker!=null){picker.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(c,d));picker=null;}}
          }
          EOF
      - run: gradle :app:assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AT-Designer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AT-Designer-APK
          path: AT-Designer.apk
