name: Validate Website
on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check website files
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f sw.js
          test -f icon.svg
          grep -q "RangMatch Pro" index.html
