name: Build Android APK
on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rangmatch-apk-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RangMatch-Pro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RangMatch-Pro-APK
          path: RangMatch-Pro.apk
      - name: Publish rolling APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build RangMatch-Pro.apk --clobber
          else
            gh release create latest-build RangMatch-Pro.apk --title "RangMatch Pro — Latest APK" --notes "Auto-built Android APK from the latest main branch." --latest
          fi
